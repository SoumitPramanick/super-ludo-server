const LudoRuleEngine={

const SnakesRuleEngine={

g><small>${saves.length>1?'2 saved games':(saves[0].type==='ludo'?'Ludo':'Snakes & Ladders')+' · Turn '+saves[0].turnCount} · Saved on this device</small></span></span><span class="continue">RESUME ${icon('arrow',16)}</span></button>`:`<div class="resume-card" style="border-color:var(--line);background:#18283b"><span style="display:flex;gap:12px;align-items:center;color:#90adab">${icon('shield',23)}<span><strong style="color:#c0cdd9">Just play. We'll keep your place.</strong><small>Your games save automatically, right here.</small></span></span></div>`}</div><div class="local-note">${icon('shield',13)} No Wi-Fi. No accounts. Just one more game.</div>`}

function showOnlineChoice(){const saved=esc(online.server||'');showModal(`<div class="eyebrow">PLAY WITH FRIENDS</div><h2>Online Ludo</h2><p>Create a private room and share the code with your friends. Up to <b>6 players</b> can join from different devices.</p><input id="online-server" class="select" style="width:100%;margin:8px 0 12px" value="${saved}" placeholder="Server address (e.g. wss://your-server/ws)"><div class="modal-list"><button class="play" data-act="create-online">${icon('users',18)} CREATE ROOM</button><button class="utility" data-act="join-online">${icon('arrow',18)} JOIN WITH ROOM CODE</button></div><div class="local-note">${icon('shield',14)} The same online server must be reachable by all players.</div>`,true,true);}
async function createOnlineRoom(){const name=prompt('Your player name','Player 1')?.trim();if(!name)return;online.name=name;toast('Creating room…');try{await OnlineManager.create(name)}catch(e){toast(e.message||'Could not create room.')}}
async function joinOnlineRoom(){const wrap=`<div class="eyebrow">JOIN A ROOM</div><h2>Enter room code</h2><p>Ask your friend for the 5-character code.</p><input id="room-code" class="select" style="width:100%;font-size:22px;letter-spacing:5px;text-align:center;text-transform:uppercase" maxlength="5" placeholder="ABCDE"><input id="room-name" class="select" style="width:100%;margin-top:12px" maxlength="24" placeholder="Your name"><div class="modal-list"><button class="play" id="join-now">JOIN ROOM ${icon('arrow',18)}</button></div>`;showModal(wrap,true,true);document.getElementById('join-now').onclick=async()=>{const code=document.getElementById('room-code').value.trim().toUpperCase(),name=document.getElementById('room-name').value.trim()||'Player';if(!/^[A-Z0-9]{5}$/.test(code)){toast('Enter a valid 5-character room code.');return}online.name=name;toast('Joining room…');try{await OnlineManager.join(code,name)}catch(e){toast(e.message)}}}
function showOnlineLobby(){const r=online.room;if(!r)return;showModal(`<div class="eyebrow">ROOM LOBBY</div><h2>Room <span style="color:var(--gold);letter-spacing:4px">${esc(r.code)}</span></h2><p>Share this code with your friends. ${r.players.length}/6 players joined.</p><button class="utility" style="width:100%;margin-bottom:15px" data-act="copy-room">${icon('save',17)} COPY ROOM CODE</button><div class="roster">${r.players.map((p,i)=>`<div class="roster-row" style="--pcolor:${COLORS[p.color]?.hex||COLORS[i%6].hex}"><div class="avatar" style="--pcolor:${COLORS[p.color]?.hex||COLORS[i%6].hex}">${COLORS[p.color]?.symbol||'◆'}</div><div class="roster-info"><strong>${esc(p.name)}</strong><small>${i===0?'HOST':'PLAYER '+(i+1)}</small></div></div>`).join('')}</div><div class="modal-list">${online.host?`<button class="play" data-act="start-online" ${r.players.length<2?'disabled':''}>START ONLINE LUDO ${icon('arrow',18)}</button>`:`<button class="play" disabled>WAITING FOR HOST…</button>`}<button class="utility" data-act="home">LEAVE ROOM</button></div>`,false,true)}
function startOnlineGame(){const r=online.room;if(!r||!online.host){toast('Only the host can start the room.');return}if(r.players.length<2){toast('At least 2 players are required.');return}const players=r.players.map((p,i)=>({name:p.name,color:i,type:'human'}));const s=newGame('ludo',players,'normal',{extra:true,pass:false,overshoot:'stay'});s.online=true;s.onlineRoom=r.code;s.phase='WAITING_FOR_ROLL';s.turn=0;s.dice=0;s.legal=[];try{OnlineManager.send({type:'start',game:s});toast('Starting online game…')}catch(e){toast(e.message||'Could not start the online game.')}}
function makeSetup(type){cancelSession();screen='setup';setup={type,mode:'ai',count:2,difficulty:'normal',players:COLORS.map((c,i)=>({name:i===0?'You':i===1?'Computer':'Computer '+i,type:i===0?'human':'ai',color:i})),extra:true,pass:true,overshoot:'stay'};if(type==='ludo')setup.players[1].color=2,setup.players[2].color=1;closeModal();render()}
function setupView(){return `<div class="setup-layout"><div class="screen-top"><button class="back" data-act="home" aria-label="Back to game room">${icon('back')}</button><div><div class="eyebrow">MAKE IT YOUR GAME</div><h1>${setup.type==='ludo'?'Ludo':'Snakes & Ladders'}</h1></div></div><div class="panel"><div class="segmented"><button class="${setup.mode==='ai'?'selected':''}" data-act="mode" data-mode="ai">${icon('bot',19)} VS COMPUTER</button><button class="${setup.mode==='local'?'selected':''}" data-act="mode" data-mode="local">${icon('users',19)} LOCAL MULTIPLAYER</button><button class="${setup.mode==='online'?'selected':''}" data-act="mode" data-mode="online">${icon('users',19)} ONLINE FRIENDS</button></div><div class="config-row"><div class="field-label">Who's joining?<small>Every seat can be human or computer.</small></div><div class="count">${[2,3,4,5,6].map(n=>`<button class="${setup.count===n?'selected':''}" data-act="count" data-n="${n}">${n}</button>`).join('')}</div></div><div class="player-rows">${setup.players.slice(0,setup.count).map((p,i)=>`<div class="player-row"><div class="avatar" style="--pcolor:${COLORS[p.color].hex}">${COLORS[p.color].symbol}</div><input aria-label="Player ${i+1} name" data-field="name" data-player="${i}" maxlength="24" value="${esc(p.name)}"><select aria-label="Player ${i+1} color" data-field="color" data-player="${i}">${COLORS.map((c,j)=>`<option value="${j}" ${p.color===j?'selected':''}>${c.name}</option>`).join('')}</select><select aria-label="Player ${i+1} type" data-field="type" data-player="${i}"><option value="human" ${p.type==='human'?'selected':''}>Human</option><option value="ai" ${p.type==='ai'?'selected':''}>Computer</option></select></div>`).join('')}</div><div class="config-row"><div class="field-label">Computer difficulty<small>${setup.type==='ludo'?'Same fair dice. A different strategy.':'A game of luck. Every computer plays fairly.'}</small></div><select class="select" data-field="difficulty" aria-label="Computer difficulty">${['easy','normal','hard'].map(d=>`<option ${setup.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="rule-box"><label><input type="checkbox" data-field="extra" ${setup.extra?'checked':''}> Extra turn on six</label><label><input type="checkbox" data-field="pass" ${setup.pass?'checked':''}> Pass-the-device screen</label>${setup.type==='snakes'?`<label>Over 100 <select class="select" data-field="overshoot"><option value="stay" ${setup.overshoot==='stay'?'selected':''}>Stay in place</option><option value="bounce" ${setup.overshoot==='bounce'?'selected':''}>Bounce back</option></select></label>`:''}</div><div class="setup-footer"><button class="utility" data-act="help">${icon('help',18)} Rules</button><button class="play" data-act="start">LET'S PLAY ${icon('arrow',20)}</button></div></div><div class="local-note">${icon('shield',14)} Everything happens on this device.</div></div>`}
function startSetup(){if(setup.mode==='online'){showOnlineChoice();return}if(setup.players.slice(0,setup.count).some(p=>!p.name.trim())){toast('Give every player a name first.');return}const start=()=>{const players=setup.players.slice(0,setup.count).map(p=>({...p,name:p.name.trim()}));startGame(newGame(setup.type,players,setup.difficulty,{extra:setup.extra,pass:setup.pass,overshoot:setup.overshoot}))};if(SaveManager.read(setup.type)?.phase&&SaveManager.read(setup.type)?.phase!=='GAME_OVER')showModal(`<div class="eyebrow">A FRESH START</div><h2>Start a new match?</h2><p>This replaces your saved ${setup.type==='ludo'?'Ludo':'Snakes & Ladders'} match. Your other game stays safe.</p><div class="modal-list"><button class="play" id="replace-save">START NEW MATCH</button><button class="utility" data-act="close">Keep my save</button></div>`),document.getElementById('replace-save').onclick=start;else start()}
function cancelSession(){epoch++;clearTimeout(aiTimer);aiTimer=null;visual.clear();special=null;paused=false}
function startGame(s){cancelSession();closeModal();game=s;screen='game';if(game.phase==='SELECTING_TOKEN')game.legal=LudoRuleEngine.legal(game);checkpoint();render();activate()}
function checkpoint(){if(game&&['WAITING_FOR_ROLL','SELECTING_TOKEN','PASS_DEVICE','GAME_OVER'].includes(game.phase)){if(!SaveManager.write(game))toast('Storage unavailable. Keep this window open to continue.')}}
function gameView(){if(!game)return '';const name=game.type==='ludo'?'Ludo':'Snakes & Ladders';return `<div class="match-header"><div style="display:flex;align-items:center;gap:13px"><button class="back" data-act="pause" aria-label="Pause game">${icon('back')}</button><div><div class="eyebrow">${game.players.some(p=>p.type==='ai')?'A FRIENDLY RIVALRY':'PASS, PLAY, REPEAT'}</div><h1>${name}</h1></div></div><div class="match-meta"><div class="offline"><i></i> ${game.online?`ONLINE · ROOM ${esc(game.onlineRoom||'')}`:'LOCAL MATCH'}</div><button class="back" data-act="pause" aria-label="Pause">${icon('pause')}</button></div></div><div class="match-content"><div class="board-frame" id="board">${game.type==='ludo'?ludoBoard(game):snakesBoard(game)}</div><aside class="match-side" id="match-side">${sideView()}</aside></div>`}
function sideView(){const p=game.players[game.turn],col=COLORS[p.color],human=p.type==='human',phase=game.phase;let message=phase==='WAITING_FOR_ROLL'?(game.extra?t('extra'):human?t('roll'):t('thinking')):phase==='SELECTING_TOKEN'?(human?t('select'):t('thinking')):phase==='ROLLING'?t('rolling'):phase==='GAME_OVER'?'What a game!':phase==='PASS_DEVICE'?'Pass to the next player':t('moving');return `<div class="turn-card"><div class="eyebrow" style="color:${col.hex}">${phase==='GAME_OVER'?'MATCH FINISHED':human?'YOUR TURN':'COMPUTER’S TURN'}</div><div class="turn-name">${esc(p.name)}</div><p class="turn-message" aria-live="polite">${message}</p><button class="roll-btn ${phase==='ROLLING'?'rolling':''}" data-act="roll" aria-label="Roll dice${game.dice?', last result '+game.dice:''}" ${phase!=='WAITING_FOR_ROLL'||!human||paused||(game.online&&online.seat!==game.turn)?'disabled':''}>${diceSVG(game.dice||5)}</button><div class="roll-caption">${phase==='SELECTING_TOKEN'?'SELECT A TOKEN':phase==='WAITING_FOR_ROLL'&&human?'TAP DICE TO ROLL':game.dice?'ROLLED A '+game.dice:'LET THE GOOD TIMES ROLL'}</div></div><div class="roster">${game.players.map((p,i)=>`<div class="roster-row ${i===game.turn?'current':''}" style="--pcolor:${COLORS[p.color].hex}"><div class="avatar">${COLORS[p.color].symbol}</div><div class="roster-info"><strong>${esc(p.name)}</strong><small>${game.online?(i===online.seat?'You':'Online player'):(p.type==='ai'?game.difficulty+' computer':'Local player')} ${i===game.turn?'· Playing':''}</small></div><div class="roster-score">${game.type==='ludo'?game.tokens[i].filter(n=>n===56).length+' / 4':game.tokens[i][0]+'<small style="font-size:9px"> / 100</small>'}</div></div>`).join('')}</div><div class="board-hint">${game.type==='ludo'?`${icon('shield',16)} <b>Stars keep you safe.</b><br>Roll a six to leave base. Bring all four tokens home with an exact roll.`:`${icon('leaf',16)} <b>A little luck goes a long way.</b><br>${game.tokens[game.turn][0]===0?'Roll a one to enter the board. ':''}Climb ladders, dodge snakes, and ${game.rules.overshoot==='stay'?'roll exactly to reach':'bounce back if you go past'} 100.`}</div><div class="turn-number">TURN ${String(game.turnCount).padStart(2,'0')} · AUTO-SAVED LOCALLY</div>${DEBUG?`<pre class="debug">${esc(JSON.stringify({turn:game.turn,phase,dice:game.dice,legal:game.legal,tokens:game.tokens},null,1))}</pre>`:''}`}
function refreshBoard(){const el=document.getElementById('board');if(el&&game){el.innerHTML=game.type==='ludo'?ludoBoard(game):snakesBoard(game);bindTokens()}}
function refreshSide(){const el=document.getElementById('match-side');if(el&&game)el.innerHTML=sideView()}
function bindTokens(){document.querySelectorAll('[data-token]').forEach(el=>{const fn=()=>{const [p,i]=el.dataset.token.split(',').map(Number);if(!paused&&game&&(!game.online||online.seat===p)&&game.turn===p&&game.players[p].type==='human'&&game.phase==='SELECTING_TOKEN'&&game.legal.includes(i))moveLudo(i)};el.onclick=fn;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}})}
/* Animation timing can pause; only the state machine grants actions. */
async function wait(ms,id=epoch){let elapsed=0,prev=performance.now();return new Promise(resolve=>{function frame(now){if(id!==epoch){resolve(false);return}if(!paused&&!document.hidden)elapsed+=Math.min(now-prev,60);prev=now;if(elapsed>=ms)resolve(true);else requestAnimationFrame(frame)}requestAnimationFrame(frame)})}
async function animatePoint(pi,ti,from,to,duration,bounce=true,curve=null,id=epoch){let elapsed=0,prev=performance.now();return new Promise(resolve=>{function frame(now){if(epoch!==id){resolve(false);return}if(!paused&&!document.hidden)elapsed+=Math.min(now-prev,50);prev=now;const q=Math.min(1,elapsed/duration),u=q*q*(3-2*q),point=curve?curvePoint(curve,u):[from[0]+(to[0]-from[0])*u,from[1]+(to[1]-from[1])*u];if(bounce)point[1]-=Math.sin(q*Math.PI)*6;visual.set(pi+','+ti,point);refreshBoard();if(q===1)resolve(true);else requestAnimationFrame(frame)}requestAnimationFrame(frame)})}
function activate(){clearTimeout(aiTimer);if(!game||screen!=='game'||paused)return;if(game.phase==='GAME_OVER'){showResults();return}if(game.phase==='PASS_DEVICE'){showPass();return}const id=epoch;if(game.players[game.turn].type==='ai'){aiTimer=setTimeout(()=>{if(id!==epoch||paused||screen!=='game')return;if(game.phase==='WAITING_FOR_ROLL')roll(true);else if(game.phase==='SELECTING_TOKEN')moveLudo(LudoAI.choose(game))},(game.difficulty==='easy'?1100:game.difficulty==='hard'?700:900)*speed())}}
async function roll(ai=false){if(!game||paused||game.phase!=='WAITING_FOR_ROLL'||(game.players[game.turn].type==='ai')!==ai)return;if(game.online&&online.seat!==game.turn)return;const id=epoch;game.phase='ROLLING';AudioManager.play('dice');refreshSide();for(let i=0;i<8;i++){game.dice=1+i%6;const b=document.querySelector('.roll-btn');if(b)b.innerHTML=diceSVG(game.dice);if(!await wait(70*speed(),id))return}game.dice=DiceManager.roll();game.phase='CHECKING_MOVES';refreshSide();AudioManager.play('click');fxBurst('dice',225,225);if(!await wait(280*speed(),id))return;if(game.type==='ludo'){game.legal=LudoRuleEngine.legal(game);if(!game.legal.length){toast(t('none'));if(!await wait(750*speed(),id))return;finish(false);return}game.phase='SELECTING_TOKEN';checkpoint();refreshBoard();refreshSide();OnlineManager.broadcastState();if(game.legal.length===1){toast('Auto move');fxText('AUTO MOVE',225,225);await wait(220*speed(),id);if(id!==epoch||paused)return;moveLudo(game.legal[0])}else activate()}else{if(!SnakesRuleEngine.legal(game).length){toast(game.tokens[game.turn][0]===0?t('start'):t('overshoot'));await wait(650*speed(),id);if(id!==epoch||paused)return;finish(false);return}moveSnakes()}}
async function moveLudo(index){if(!game||paused||game.phase!=='SELECTING_TOKEN')return;if(game.online&&online.seat!==game.turn)return;const plan=LudoRuleEngine.plan(game,index);if(!plan)return;const id=epoch,pi=game.turn,color=game.players[pi].color;game.phase='MOVING_TOKEN';let from=ludoXY(color,plan.start,index);visual.set(pi+','+index,from);const won=LudoRuleEngine.apply(game,plan);/* rules commit before animation; previous stable snapshot remains durable */refreshSide();for(const pos of plan.path){const to=ludoXY(color,pos,index);AudioManager.play('step');if(!await animatePoint(pi,index,from,to,175*speed(),true,null,id))return;from=to}visual.delete(pi+','+index);game.phase='RESOLVING_CAPTURE';if(plan.captured.length){toast(t('capture'));AudioManager.play('capture');fxBurst('capture',...ludoXY(color,plan.end,index));fxText('CAPTURE!',...ludoXY(color,plan.end,index),'#ec7768');if(!await wait(420*speed(),id))return}else if(plan.home){toast(t('home'));AudioManager.play('home');fxBurst('home',...ludoXY(color,plan.end,index));fxText('HOME!',...ludoXY(color,plan.end,index))}else if(plan.safe){toast(t('safe'));AudioManager.play('safe');fxBurst('safe',...ludoXY(color,plan.end,index))}game.phase='CHECKING_HOME';refreshBoard();if(!await wait(160*speed(),id))return;finish(won)}
async function moveSnakes(){if(!game||game.phase!=='CHECKING_MOVES')return;const id=epoch,pi=game.turn,plan=SnakesRuleEngine.plan(game);game.phase='MOVING_TOKEN';let from=snakeXY(plan.start);visual.set(pi+',0',from);const won=SnakesRuleEngine.apply(game,plan);refreshSide();if(plan.overshoot){toast(plan.needSix?t('start'):t('overshoot'));if(!await wait(850*speed(),id))return}else{for(const pos of plan.path){const to=snakeXY(pos);AudioManager.play('step');if(!await animatePoint(pi,0,from,to,180*speed(),true,null,id))return;from=to}if(plan.jump){game.phase='CHECKING_SPECIAL_EVENT';special=plan.jump+plan.landing;toast(t(plan.jump));AudioManager.play(plan.jump);refreshBoard();fxBurst(plan.jump,...snakeXY(plan.landing));fxText(plan.jump==='ladder'?'UP!':'SLIDE!',...snakeXY(plan.landing),plan.jump==='ladder'?'#f7cb76':'#f0a979');if(!await wait(400*speed(),id))return;const to=snakeXY(plan.end),curve=plan.jump==='snake'?snakeCurve(plan.landing,plan.end):null;if(!await animatePoint(pi,0,from,to,1000*speed(),false,curve,id))return}}visual.delete(pi+',0');special=null;refreshBoard();if(!await wait(180*speed(),id))return;finish(won)}
function finish(won){if(!game)return;game.phase='CHECKING_WIN';TurnManager.finish(game,won);checkpoint();refreshBoard();refreshSide();if(game.online)OnlineManager.broadcastState();activate()}
function showPass(){const p=game.players[game.turn];showModal(`<div class="center"><div class="eyebrow">PASS THE DEVICE</div><div class="avatar pass-avatar" style="--pcolor:${COLORS[p.color].hex}">${COLORS[p.color].symbol}</div><p>Next up</p><h2>${esc(p.name)}</h2><p>Your next move is waiting.</p><div class="modal-list"><button class="play" data-act="pass-continue">I'M READY ${icon('arrow')}</button><button class="utility" data-act="pause">Pause match</button></div></div>`,false)}
function showResults(){AudioManager.play('win');showModal(`<div class="center"><div class="eyebrow">THAT'S HOW YOU ROLL</div><div class="trophy">${icon('trophy',80)}</div><div class="win-name">${esc(game.players[game.winner].name)}</div><h2>wins!</h2><p>A little luck. A lot of good moves.</p><div class="results-data"><div><strong>${game.type==='ludo'?'4 / 4':'100 / 100'}</strong>${game.type==='ludo'?'TOKENS HOME':'SQUARES REACHED'}</div><div><strong>${game.turnCount}</strong>TURNS PLAYED</div></div><div class="modal-list"><button class="play" data-act="restart">PLAY AGAIN ${icon('arrow')}</button><button class="utility" data-act="results-home">Back to game room</button></div></div>`,false);const c=document.createElement('div');c.className='confetti';c.innerHTML=Array.from({length:42},(_,i)=>`<i style="--x:${Math.random()*100}%;--t:${2+Math.random()*3}s;--c:${COLORS[i%4].hex};--r:${Math.random()*360}deg"></i>`).join('');document.body.append(c);setTimeout(()=>c.remove(),5500)}
function showModal(html,closable=true,wide=false){modalRoot.innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="Game menu">${closable?`<button class="icon-btn close" data-act="close" aria-label="Close">${icon('close')}</button>`:''}${html}</section></div>`;setTimeout(()=>modalRoot.querySelector('button,input,select')?.focus(),30)}
function closeModal(){modalRoot.innerHTML='';modalReturn=null}
function freeze(){if(screen==='game'&&game){paused=true;clearTimeout(aiTimer);refreshSide()}}
function resumeActive(){paused=false;closeModal();refreshSide();activate()}
function pauseMenu(){freeze();showModal(`<div class="eyebrow">TAKE YOUR TIME</div><h2>Game paused.</h2><p>A good rivalry can wait a moment.</p><div class="modal-list"><button class="play" data-act="unpause">RESUME GAME ${icon('arrow')}</button><button class="utility" data-act="restart-confirm">${icon('dice')} Restart game</button><button class="utility" data-act="help">${icon('help')} How to play</button><button class="utility" data-act="settings">${icon('settings')} Settings</button><button class="utility" data-act="home">${icon('home')} Main menu</button></div>`,false)}
function restart(){const old=game;startGame(newGame(old.type,old.players,old.difficulty,{...old.rules}))}
function exitPrompt(next=goHome){freeze();showModal(`<div class="eyebrow">KEEP YOUR PLACE?</div><h2>Save this match?</h2><p>${['WAITING_FOR_ROLL','SELECTING_TOKEN','PASS_DEVICE','GAME_OVER'].includes(game.phase)?'Pick up exactly where you left off.':'Your last completed action is saved. The current animation will be replayed from that checkpoint.'} Your other game is always kept separate.</p><div class="modal-list"><button class="play" id="exit-save">SAVE & LEAVE</button><button class="utility" id="exit-discard">Leave without saving</button><button class="utility" data-act="unpause">Keep playing</button></div>`,false);document.getElementById('exit-save').onclick=()=>{checkpoint();next()};document.getElementById('exit-discard').onclick=()=>{SaveManager.remove(game.type);next()}}
function goHome(){cancelSession();if(online.connected)OnlineManager.leave();game=null;screen='home';closeModal();render()}
function showSaves(){const saves=getSaves();showModal(`<div class="eyebrow">WELCOME BACK</div><h2>Pick up where you left off.</h2><p>Saved locally. Ready when you are.</p>${saves.map(s=>`<div class="save-row"><div style="color:var(--gold)">${icon(s.type==='ludo'?'dice':'snake',28)}</div><div><strong>${s.type==='ludo'?'Ludo':'Snakes & Ladders'}</strong><small>Turn ${s.turnCount} · ${s.players.length} players</small></div><button class="utility" data-act="load" data-type="${s.type}">Resume ${icon('arrow',16)}</button></div>`).join('')}`)}
function showSettings(){freeze();showModal(`<div class="eyebrow">THE LITTLE DETAILS</div><h2>Make yourself at home.</h2><p>Your preferences stay on this device.</p>${[['sfx','Sound effects','Dice, steps, and little celebrations'],['music','Background music','A soft, original little melody'],['vibration','Vibration','Gentle feedback on supported devices']].map(([key,label,sub])=>`<div class="setting-row"><div class="field-label">${label}<small>${sub}</small></div><button class="toggle ${settings[key]?'on':''}" role="switch" aria-checked="${!!settings[key]}" aria-label="${label}" data-act="toggle" data-key="${key}"><i></i></button></div>`).join('')}<div class="setting-row"><div class="field-label">Animation speed<small>A leisurely game or a quick rematch.</small></div><select class="select" aria-label="Animation speed" data-field="speed"><option value="normal" ${settings.speed==='normal'?'selected':''}>Normal</option><option value="fast" ${settings.speed==='fast'?'selected':''}>Fast</option></select></div><div class="modal-list"><button class="play" data-act="close">ALL SET ${icon('arrow')}</button></div>`);modalReturn=screen==='game'?'pause':null}
function showHelp(type=game?.type||setup?.type||'ludo'){freeze();const steps=type==='ludo'?[['⚄','Roll a six','Bring a token out of base, or move a token already in play.'],['➜','Make your move','Tap a glowing token. Travel around the board, one square at a time.'],['✦','Play it smart','Land on an opponent to send them back. Stars are always safe.'],['◆','Bring everyone home','Follow your colored lane. An exact roll takes each token home. First to four wins.']]:[['⚄','Roll a one to start','Just like Ludo, your first roll must be a one to enter the board. After that, move forward normally.'],['↗','Climb a ladder','Land on the bottom of a ladder and go all the way to its top.'],['↘','Watch those snakes','Land on a snake’s head and slide all the way down to its tail.'],['✦','Race to 100','Reach square 100 to win. Overshoots stay in place, or bounce back if enabled.']];showModal(`<div class="eyebrow">EVERY GREAT GAME STARTS HERE</div><h2>Easy to learn. Fun to master.</h2><div class="segmented" style="margin-top:24px"><button class="${type==='ludo'?'selected':''}" data-act="help-tab" data-type="ludo">LUDO</button><button class="${type==='snakes'?'selected':''}" data-act="help-tab" data-type="snakes">SNAKES & LADDERS</button></div><div class="tutorial-steps">${steps.map(([sym,h,p])=>`<div class="tutorial-step"><b><span>${sym}</span>${h}</b><p>${p}</p></div>`).join('')}</div><p style="font-size:11px">${type==='ludo'?'Sixes grant extra turns when enabled. Captures and reaching home do not. Multiple tokens may share a square; there are no blockades.':'Snakes and ladders activate only on your final landing square. Computers use exactly the same fair dice.'}</p><div class="modal-list"><button class="play" data-act="close">GOT IT ${icon('arrow')}</button></div>`,true,true);modalReturn=screen==='game'?'pause':null}
function persistSettings(){try{localStorage.setItem('superludo.settings',JSON.stringify(settings))}catch{toast('Preferences cannot be saved in this browser.')}AudioManager.sync()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;AudioManager.init();const a=b.dataset.act;if(a!=='roll')AudioManager.play('click');if(a==='setup')openSetup(b.dataset.type);else if(a==='online')showOnlineChoice();else if(a==='create-online')createOnlineRoom();else if(a==='join-online')joinOnlineRoom();else if(a==='start-online')startOnlineGame();else if(a==='copy-room'){navigator.clipboard?.writeText(online.room?.code||'').catch(()=>{});toast('Room code copied!')}else if(a==='home')screen==='game'&&game?exitPrompt():goHome();else if(a==='mode'){setup.mode=b.dataset.mode;setup.players.forEach((p,i)=>{p.type=setup.mode==='ai'?(i===0?'human':'ai'):'human';p.name=setup.mode==='ai'?(i===0?'You':i===1?'Computer':'Computer '+i):'Player '+(i+1)});if(setup.mode==='online')showOnlineChoice();else render()}else if(a==='count'){setup.count=+b.dataset.n;render()}else if(a==='start')startSetup();else if(a==='roll')roll();else if(a==='pause')pauseMenu();else if(a==='unpause')resumeActive();else if(a==='pass-continue'){closeModal();paused=false;game.phase='WAITING_FOR_ROLL';checkpoint();refreshSide();activate()}else if(a==='settings')showSettings();else if(a==='help'||a==='help-tab')showHelp(b.dataset.type);else if(a==='close'){const back=modalReturn;closeModal();if(screen==='game'&&paused){if(back==='pause')pauseMenu();else resumeActive()}}else if(a==='sound'){settings.sfx=!settings.sfx;persistSettings();render()}else if(a==='toggle'){settings[b.dataset.key]=!settings[b.dataset.key];persistSettings();showSettings()}else if(a==='resume-list')showSaves();else if(a==='load'){const s=SaveManager.read(b.dataset.type);if(s)startGame(s);else toast(t('invalid'))}else if(a==='restart')restart();else if(a==='restart-confirm'){showModal(`<div class="eyebrow">ANOTHER ROUND?</div><h2>Start over?</h2><p>This resets the current match with the same players and rules.</p><div class="modal-list"><button class="play" data-act="restart">RESTART MATCH</button><button class="utility" data-act="pause">Keep this match</button></div>`,false)}else if(a==='results-home')goHome()});
document.addEventListener('input',e=>{const b=e.target;if(b.dataset.field==='name'&&setup)setup.players[+b.dataset.player].name=b.value});
document.addEventListener('change',e=>{const b=e.target,f=b.dataset.field;if(!f)return;if(f==='speed'){settings.speed=b.value;persistSettings();return}if(!setup)return;if(f==='color'){const i=+b.dataset.player,n=+b.value,other=setup.players.findIndex(p=>p.color===n),old=setup.players[i].color;if(other>=0)setup.players[other].color=old;setup.players[i].color=n;render()}else if(f==='type'){setup.players[+b.dataset.player].type=b.value}else if(f==='extra'||f==='pass')setup[f]=b.checked;else if(f==='difficulty'||f==='overshoot')setup[f]=b.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen==='game'){if(paused)resumeActive();else pauseMenu()}if(e.key==='Tab'&&modalRoot.firstChild){const list=[...modalRoot.querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled),first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game'&&!paused)pauseMenu()});
window.addEventListener('beforeunload',()=>checkpoint());
render();const splash=document.createElement('div');splash.className='splash';splash.innerHTML=`<div style="width:74px;height:74px;transform:rotate(-12deg)">${diceSVG(4)}</div><div class="brand-name">SUPER<span>LUDO</span></div>`;document.body.append(splash);setTimeout(()=>splash.remove(),1000);
if(DEBUG){console.info('SUPER LUDO regression tests',runRuleTests());window.__superLudo={get state(){return game},LudoRuleEngine,SnakesRuleEngine,DiceManager,SaveManager,newGame}}
</script>
</body></html>
